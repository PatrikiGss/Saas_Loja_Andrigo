version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
    groups:
      # Vite, Vitest e vue-tsc sobem juntos: atualizar um sem os outros
      # costuma quebrar a compatibilidade entre eles.
      ferramentas:
        patterns:
          - 'vite'
          - 'vitest'
          - '@vitest/*'
          - '@vitejs/*'
          - 'vue-tsc'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
