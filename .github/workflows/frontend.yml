name: Frontend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: Testes, tipos e build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `ci` e não `install`: instala exatamente o que está no lock, e falha
      # se ele estiver fora de sincronia com o package.json.
      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run verificar-formato

      # Os tipos da API são gerados de backend/schema.yml. Se o arquivo gerado
      # não bate com o esquema, alguém mudou a API e não regenerou, e a
      # verificação de tipos abaixo estaria conferindo contra a API antiga.
      - name: Tipos da API em dia
        run: |
          npm run gerar-tipos
          git diff --exit-code src/types/esquema.ts

      - name: Tipos
        run: npm run verificar-tipos

      - name: Testes e cobertura
        run: npm run cobertura

      # O build roda o vue-tsc antes do vite, então também pega erro de tipo
      # que só aparece na compilação de produção.
      - name: Build
        run: npm run build

      - name: Vulnerabilidades nas dependências
        run: npm audit --audit-level=moderate
