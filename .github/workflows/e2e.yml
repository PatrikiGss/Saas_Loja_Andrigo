name: Ponta a ponta

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    name: Fluxos no navegador
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      # Valores só do CI. O banco é o de teste, que o testserver cria do zero a
      # cada rodada; nada aqui vale em produção.
      SECRET_KEY: chave-de-teste-do-ci-nao-usar-em-producao
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Dependências do backend
        run: pip install -r ../requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependências do frontend
        run: npm ci

      - name: Navegador
        run: npx playwright install --with-deps chromium

      # O Playwright sobe o backend com `manage.py testserver` e o frontend com
      # o Vite, e derruba os dois no fim.
      - name: Testes ponta a ponta
        run: npm run e2e

      # Com falha, o rastro de cada passo — tela, rede e console — fica aqui.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: relatorio-e2e
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
