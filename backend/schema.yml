components:
  schemas:
    Acesso:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    AdicionarItemRequest:
      type: object
      description: |-
        Entrada da inclusão: só produto e quantidade.

        O produto é procurado entre os ativos, então um id inativo ou inexistente
        cai na mesma resposta e não conta o que existe no catálogo.
      properties:
        produto:
          type: string
          format: uuid
        quantidade:
          type: integer
          maximum: 100
          minimum: 1
      required:
      - produto
      - quantidade
    AjusteEstoqueRequest:
      type: object
      description: 'Entrada do ajuste de estoque: positivo repõe, negativo dá baixa.'
      properties:
        delta:
          type: integer
          maximum: 100000
          minimum: -100000
      required:
      - delta
    AlteracaoNivel:
      type: object
      description: Entrada da troca de nível, aceita somente de contas admin.
      properties:
        nivel:
          $ref: '#/components/schemas/NivelEnum'
      required:
      - nivel
    AlteracaoNivelRequest:
      type: object
      description: Entrada da troca de nível, aceita somente de contas admin.
      properties:
        nivel:
          $ref: '#/components/schemas/NivelEnum'
      required:
      - nivel
    AlteracaoStatusRequest:
      type: object
      description: Entrada da mudança de status, aceita somente de contas admin.
      properties:
        status:
          $ref: '#/components/schemas/StatusPedidoEnum'
      required:
      - status
    AlterarSenhaRequest:
      type: object
      description: Troca de senha pela própria conta, com confirmação da senha atual.
      properties:
        senha_atual:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        nova_senha:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - nova_senha
      - senha_atual
    AtivarContaRequest:
      type: object
      description: Confirmação do e-mail pelo link do cadastro.
      properties:
        uid:
          type: string
          minLength: 1
          maxLength: 40
        token:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - token
      - uid
    CadastroRequest:
      type: object
      description: |-
        Cadastro público, que cria apenas contas de nível usuário.

        É um `Serializer` e não um `ModelSerializer` de propósito: os únicos campos
        que existem aqui são estes três, então nenhum payload alcança `is_staff`,
        `is_superuser`, `groups` ou `user_permissions`.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        nome:
          type: string
          default: ''
          maxLength: 150
      required:
      - email
      - password
    Carrinho:
      type: object
      description: 'O carrinho inteiro. O dono não aparece: quem pergunta já é o dono.'
      properties:
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemCarrinho'
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - itens
      - total
    CategoriaEnum:
      enum:
      - pod_descartavel
      - pod_recarregavel
      - vape
      - essencia
      - vaporizador_ervas
      type: string
      description: |-
        * `pod_descartavel` - Pod descartável
        * `pod_recarregavel` - Pod recarregável
        * `vape` - Vape
        * `essencia` - Essência
        * `vaporizador_ervas` - Vaporizador de ervas
    CheckoutRequest:
      type: object
      description: 'Entrada do checkout: endereço e serviço de frete, nada além disso.'
      properties:
        endereco:
          type: integer
        servico:
          $ref: '#/components/schemas/ServicoFreteEnum'
      required:
      - endereco
      - servico
    ContaCriada:
      type: object
      description: 'Resposta do cadastro: o mínimo, e nunca a senha nem o hash dela.'
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        nome:
          type: string
          readOnly: true
        nivel:
          allOf:
          - $ref: '#/components/schemas/NivelEnum'
          readOnly: true
        ativo:
          type: boolean
          readOnly: true
      required:
      - ativo
      - email
      - id
      - nivel
      - nome
    CotacaoFreteRequest:
      type: object
      description: 'Entrada da cotação: só o destino.'
      properties:
        endereco:
          type: integer
      required:
      - endereco
    Endereco:
      type: object
      description: 'Endereço do cliente. O dono nunca vem do payload: vem do token.'
      properties:
        id:
          type: integer
          readOnly: true
        apelido:
          type: string
          maxLength: 30
        cep:
          type: string
          pattern: ^\d{8}$
          maxLength: 8
        logradouro:
          type: string
          maxLength: 120
        numero:
          type: string
          maxLength: 10
        complemento:
          type: string
          maxLength: 60
        bairro:
          type: string
          maxLength: 60
        cidade:
          type: string
          maxLength: 60
        uf:
          $ref: '#/components/schemas/UFEnum'
      required:
      - apelido
      - bairro
      - cep
      - cidade
      - complemento
      - id
      - logradouro
      - numero
      - uf
    EnderecoConsultado:
      type: object
      description: Saída da consulta de CEP.
      properties:
        cep:
          type: string
          readOnly: true
        logradouro:
          type: string
          readOnly: true
        complemento:
          type: string
          readOnly: true
        bairro:
          type: string
          readOnly: true
        cidade:
          type: string
          readOnly: true
        uf:
          type: string
          readOnly: true
      required:
      - bairro
      - cep
      - cidade
      - complemento
      - logradouro
      - uf
    EnderecoDeEntrega:
      type: object
      description: Endereço como ele estava no dia da compra.
      properties:
        cep:
          type: string
          readOnly: true
        logradouro:
          type: string
          readOnly: true
        numero:
          type: string
          readOnly: true
        complemento:
          type: string
          readOnly: true
        bairro:
          type: string
          readOnly: true
        cidade:
          type: string
          readOnly: true
        uf:
          allOf:
          - $ref: '#/components/schemas/UFEnum'
          readOnly: true
      required:
      - bairro
      - cep
      - cidade
      - complemento
      - logradouro
      - numero
      - uf
    EnderecoRequest:
      type: object
      description: 'Endereço do cliente. O dono nunca vem do payload: vem do token.'
      properties:
        apelido:
          type: string
          maxLength: 30
        cep:
          type: string
          minLength: 1
          pattern: ^\d{8}$
          maxLength: 8
        logradouro:
          type: string
          minLength: 1
          maxLength: 120
        numero:
          type: string
          minLength: 1
          maxLength: 10
        complemento:
          type: string
          maxLength: 60
        bairro:
          type: string
          minLength: 1
          maxLength: 60
        cidade:
          type: string
          minLength: 1
          maxLength: 60
        uf:
          $ref: '#/components/schemas/UFEnum'
      required:
      - bairro
      - cep
      - cidade
      - logradouro
      - numero
      - uf
    EspecificacaoEnum:
      enum:
      - puffs
      - volume_ml
      - nicotina_mg_ml
      type: string
      description: |-
        * `puffs` - puffs
        * `volume_ml` - volume_ml
        * `nicotina_mg_ml` - nicotina_mg_ml
    EstoqueAjustado:
      type: object
      properties:
        estoque:
          type: integer
      required:
      - estoque
    ItemCarrinho:
      type: object
      description: 'Leitura do item: preço e subtotal vêm do servidor.'
      properties:
        id:
          type: integer
          readOnly: true
        produto:
          allOf:
          - $ref: '#/components/schemas/ProdutoNoCarrinho'
          readOnly: true
        quantidade:
          type: integer
          readOnly: true
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - id
      - produto
      - quantidade
      - subtotal
    ItemPedido:
      type: object
      description: Linha da compra. Tudo aqui é histórico e não muda mais.
      properties:
        sku:
          type: string
          readOnly: true
        nome:
          type: string
          readOnly: true
        preco_unitario:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        quantidade:
          type: integer
          readOnly: true
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - nome
      - preco_unitario
      - quantidade
      - sku
      - subtotal
    LoginRequest:
      type: object
      description: |-
        Login por e-mail, usando o fluxo de token do simplejwt.

        O token não carrega o nível da conta: quem decide autorização é o banco, a
        cada requisição.
      properties:
        email:
          type: string
          format: email
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    NivelEnum:
      enum:
      - usuario
      - admin
      type: string
      description: |-
        * `usuario` - Usuário
        * `admin` - Admin
    OpcaoFrete:
      type: object
      description: Saída da cotação, como o frontend recebe.
      properties:
        servico:
          allOf:
          - $ref: '#/components/schemas/ServicoFreteEnum'
          readOnly: true
        nome:
          type: string
          readOnly: true
        preco:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        prazo_em_dias:
          type: integer
          readOnly: true
      required:
      - nome
      - prazo_em_dias
      - preco
      - servico
    PaginatedEnderecoList:
      type: object
      required:
      - count
      - next
      - previous
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Endereco'
    PaginatedPedidoList:
      type: object
      required:
      - count
      - next
      - previous
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Pedido'
    PaginatedProdutoConformeQuemPerguntaList:
      type: object
      required:
      - count
      - next
      - previous
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProdutoConformeQuemPergunta'
    PaginatedSubtipoList:
      type: object
      required:
      - count
      - next
      - previous
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Subtipo'
    PaginatedUsuarioAdminList:
      type: object
      required:
      - count
      - next
      - previous
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/UsuarioAdmin'
    PatchedEnderecoRequest:
      type: object
      description: 'Endereço do cliente. O dono nunca vem do payload: vem do token.'
      properties:
        apelido:
          type: string
          maxLength: 30
        cep:
          type: string
          minLength: 1
          pattern: ^\d{8}$
          maxLength: 8
        logradouro:
          type: string
          minLength: 1
          maxLength: 120
        numero:
          type: string
          minLength: 1
          maxLength: 10
        complemento:
          type: string
          maxLength: 60
        bairro:
          type: string
          minLength: 1
          maxLength: 60
        cidade:
          type: string
          minLength: 1
          maxLength: 60
        uf:
          $ref: '#/components/schemas/UFEnum'
    PatchedPerfilRequest:
      type: object
      description: |-
        Perfil da própria conta.

        E-mail e nível são somente leitura: o e-mail identifica a conta no login e
        o nível vive em `is_staff`, fora do alcance do cliente.
      properties:
        nome:
          type: string
          maxLength: 150
        sobrenome:
          type: string
          maxLength: 150
        telefone:
          oneOf:
          - type: string
            pattern: ^\+?[0-9][0-9 ()-]{7,19}$
            maxLength: 20
          - type: string
            maxLength: 0
    PatchedProdutoGestaoRequest:
      type: object
      description: |-
        Cadastro do produto pela equipe da loja.

        `estoque` continua somente leitura aqui: ele muda apenas pelo endpoint de
        ajuste, que registra a operação em uma única consulta atômica.
      properties:
        sku:
          type: string
          minLength: 1
          pattern: ^[A-Z0-9][A-Z0-9-]{3,31}$
          maxLength: 32
        nome:
          type: string
          minLength: 1
          maxLength: 120
