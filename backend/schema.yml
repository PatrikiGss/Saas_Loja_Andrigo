        não aparecem em nenhuma hipótese.
      properties:
        ativo:
          type: boolean
    Pedido:
      type: object
      description: |-
        Pedido. Nada aqui é gravável pela API.

        `cliente` é o e-mail da conta dona, para a gestão saber de quem é o pedido;
        o cliente só enxerga os próprios, então só vê o próprio e-mail.
        `proximos_status` são as transições que a loja pode fazer a partir daqui,
        e `pode_cancelar` diz se o próprio cliente ainda pode desistir. As duas
        saem das regras do modelo, para a tela oferecer só o que o servidor aceita.
      properties:
        numero:
          type: string
          readOnly: true
        cliente:
          type: string
          format: email
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusPedidoEnum'
          readOnly: true
        status_pagamento:
          allOf:
          - $ref: '#/components/schemas/StatusPagamentoEnum'
          readOnly: true
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemPedido'
          readOnly: true
        entrega:
          allOf:
          - $ref: '#/components/schemas/EnderecoDeEntrega'
          readOnly: true
        servico_frete:
          allOf:
          - $ref: '#/components/schemas/ServicoFreteEnum'
          readOnly: true
        prazo_frete_em_dias:
          type: integer
          readOnly: true
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        frete:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        criado_em:
          type: string
          format: date-time
          readOnly: true
        pago_em:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        proximos_status:
          type: array
          items:
            $ref: '#/components/schemas/StatusPedidoEnum'
          readOnly: true
        pode_cancelar:
          type: boolean
          readOnly: true
      required:
      - cliente
      - criado_em
      - entrega
      - frete
      - itens
      - numero
      - pago_em
      - pode_cancelar
      - prazo_frete_em_dias
      - proximos_status
      - servico_frete
      - status
      - status_pagamento
      - subtotal
      - total
