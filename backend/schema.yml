openapi: 3.0.3
info:
  title: BigPuffs
  version: 0.1.0
paths:
  /api/auth/ativar/:
    post:
      operationId: auth_ativar_create
      description: Confirma o e-mail do cadastro e libera a conta.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtivarContaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AtivarContaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AtivarContaRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/cadastro/:
    post:
      operationId: auth_cadastro_create
      description: |-
        Cria contas de nível usuário. Público, com limite de tentativas.

        A conta nasce desativada e só passa a funcionar depois que a pessoa
        confirma o e-mail, o que encarece a criação de conta em massa.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastroRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CadastroRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CadastroRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContaCriada'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Emite o access token no corpo e o refresh em cookie httpOnly.

        Duas barreiras contra força bruta: o limite por minuto, que é por IP, e o
        bloqueio por conta depois de algumas senhas erradas.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acesso'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        Encerra a sessão: derruba o refresh e apaga o cookie.

        Aberta de propósito. O access token pode já ter expirado quando a pessoa
        clica em sair, e exigir autenticação aqui deixaria o cookie pendurado
        justamente no caso em que ele mais precisa sumir.
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Renova o access token a partir do cookie.

        O refresh não vem do corpo e não volta no corpo: entra e sai pelo cookie
        httpOnly, então nenhuma linha de JavaScript encosta nele. Conta apagada
        responde 401, e não erro 500.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acesso'
          description: ''
  /api/auth/senha/:
    post:
      operationId: auth_senha_create
      description: |-
        Troca de senha da própria conta.

        Depois da troca, os refresh tokens em circulação são invalidados: quem
        tiver roubado um deixa de conseguir renovar o acesso.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlterarSenhaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AlterarSenhaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AlterarSenhaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/senha/recuperar/:
    post:
      operationId: auth_senha_recuperar_create
      description: |-
        Pede o link de recuperação.

        A resposta é 204 exista ou não a conta, então este endpoint não serve
        para descobrir quem tem cadastro.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecuperarSenhaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecuperarSenhaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecuperarSenhaRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/senha/redefinir/:
    post:
      operationId: auth_senha_redefinir_create
      description: Define a nova senha a partir do link recebido por e-mail.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedefinirSenhaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RedefinirSenhaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RedefinirSenhaRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/carrinho/:
    get:
      operationId: carrinho_retrieve
      description: Carrinho da conta autenticada, criado no primeiro acesso.
      tags:
      - carrinho
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carrinho'
          description: ''
  /api/carrinho/itens/:
    post:
      operationId: carrinho_itens_create
      description: Adiciona o produto. Produto repetido soma à quantidade do item.
      tags:
      - carrinho
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdicionarItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdicionarItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdicionarItemRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCarrinho'
          description: ''
    delete:
      operationId: carrinho_itens_limpar
      description: Esvazia o carrinho. O carrinho em si continua existindo.
      tags:
      - carrinho
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/carrinho/itens/{id}/:
    get:
      operationId: carrinho_itens_retrieve
      description: |-
        Item do próprio carrinho.

        A consulta já nasce restrita à conta autenticada: o item de outra pessoa
        não existe aqui, então a resposta é 404 e nada é confirmado sobre ele.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - carrinho
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCarrinho'
          description: ''
    put:
      operationId: carrinho_itens_update
      description: |-
        Item do próprio carrinho.

        A consulta já nasce restrita à conta autenticada: o item de outra pessoa
        não existe aqui, então a resposta é 404 e nada é confirmado sobre ele.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - carrinho
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuantidadeItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuantidadeItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuantidadeItemRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCarrinho'
          description: ''
    patch:
      operationId: carrinho_itens_partial_update
      description: |-
        Item do próprio carrinho.

        A consulta já nasce restrita à conta autenticada: o item de outra pessoa
        não existe aqui, então a resposta é 404 e nada é confirmado sobre ele.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - carrinho
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedQuantidadeItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedQuantidadeItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedQuantidadeItemRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCarrinho'
          description: ''
    delete:
      operationId: carrinho_itens_destroy
      description: |-
        Item do próprio carrinho.

        A consulta já nasce restrita à conta autenticada: o item de outra pessoa
        não existe aqui, então a resposta é 404 e nada é confirmado sobre ele.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - carrinho
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/cep/{cep}/:
    get:
      operationId: cep_retrieve
      description: Consulta de CEP feita pelo backend, com limite por minuto.
      parameters:
      - in: path
        name: cep
        schema:
          type: string
        required: true
      tags:
      - cep
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnderecoConsultado'
          description: ''
  /api/checkout/:
    post:
      operationId: checkout_create
      description: Fecha o carrinho e devolve o pedido.
      tags:
      - checkout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
          description: ''
  /api/enderecos/:
    get:
      operationId: enderecos_list
      description: |-
        Endereços do cliente.

        A consulta nasce restrita à conta autenticada, então o endereço de outra
        pessoa não existe aqui: a resposta é 404.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - enderecos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEnderecoList'
          description: ''
    post:
      operationId: enderecos_create
      description: |-
        Endereços do cliente.

        A consulta nasce restrita à conta autenticada, então o endereço de outra
        pessoa não existe aqui: a resposta é 404.
      tags:
      - enderecos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnderecoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EnderecoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnderecoRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endereco'
          description: ''
  /api/enderecos/{id}/:
    get:
      operationId: enderecos_retrieve
      description: |-
        Endereços do cliente.

        A consulta nasce restrita à conta autenticada, então o endereço de outra
        pessoa não existe aqui: a resposta é 404.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this endereco.
        required: true
      tags:
      - enderecos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endereco'
          description: ''
    put:
      operationId: enderecos_update
      description: |-
        Endereços do cliente.

        A consulta nasce restrita à conta autenticada, então o endereço de outra
        pessoa não existe aqui: a resposta é 404.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this endereco.
        required: true
      tags:
      - enderecos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnderecoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EnderecoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnderecoRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endereco'
          description: ''
    patch:
      operationId: enderecos_partial_update
      description: |-
        Endereços do cliente.

        A consulta nasce restrita à conta autenticada, então o endereço de outra
        pessoa não existe aqui: a resposta é 404.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this endereco.
        required: true
      tags:
      - enderecos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEnderecoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEnderecoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEnderecoRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endereco'
          description: ''
    delete:
      operationId: enderecos_destroy
      description: |-
        Endereços do cliente.

        A consulta nasce restrita à conta autenticada, então o endereço de outra
        pessoa não existe aqui: a resposta é 404.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this endereco.
        required: true
      tags:
      - enderecos
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/frete/cotacao/:
    post:
      operationId: frete_cotacao_create
      description: Opções de frete para o carrinho da conta e um endereço dela.
      tags:
      - frete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CotacaoFreteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CotacaoFreteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CotacaoFreteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpcaoFrete'
          description: ''
  /api/pedidos/:
    get:
      operationId: pedidos_list
      description: |-
        Pedidos.

        O cliente enxerga os seus; admin enxerga todos, que é a política
        administrativa que o projeto já usa no catálogo.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - pedidos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPedidoList'
          description: ''
  /api/pedidos/{numero}/:
    get:
      operationId: pedidos_retrieve
      description: |-
        Pedidos.

        O cliente enxerga os seus; admin enxerga todos, que é a política
        administrativa que o projeto já usa no catálogo.
      parameters:
      - in: path
        name: numero
        schema:
          type: string
        required: true
      tags:
      - pedidos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
          description: ''
  /api/pedidos/{numero}/cancelar/:
    post:
      operationId: pedidos_cancelar_create
      description: |-
        Cancela o próprio pedido enquanto ele espera pagamento.

        A consulta é a da própria conta mesmo para admin: pedido de outra
        pessoa não existe aqui, e a resposta é 404. A loja cancela pelo fluxo
        de status, que tem trilha de auditoria.
      parameters:
      - in: path
        name: numero
        schema:
          type: string
        required: true
      tags:
      - pedidos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
          description: ''
  /api/pedidos/{numero}/status/:
    post:
      operationId: pedidos_status_create
      description: Move o pedido no fluxo. Só admin, e só transição prevista.
      parameters:
      - in: path
        name: numero
        schema:
          type: string
        required: true
      tags:
      - pedidos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlteracaoStatusRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AlteracaoStatusRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AlteracaoStatusRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
          description: ''
  /api/perfil/:
    get:
      operationId: perfil_retrieve
      description: |-
        Perfil da conta autenticada.

        Não existe id na URL: o objeto vem do token, então não há recurso de outra
        pessoa para pedir.
      tags:
      - perfil
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
          description: ''
    put:
      operationId: perfil_update
      description: |-
        Perfil da conta autenticada.

        Não existe id na URL: o objeto vem do token, então não há recurso de outra
        pessoa para pedir.
      tags:
      - perfil
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerfilRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PerfilRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PerfilRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
          description: ''
    patch:
      operationId: perfil_partial_update
      description: |-
        Perfil da conta autenticada.

        Não existe id na URL: o objeto vem do token, então não há recurso de outra
        pessoa para pedir.
      tags:
      - perfil
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPerfilRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPerfilRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPerfilRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
          description: ''
  /api/produtos/:
    get:
      operationId: produtos_list
      description: |-
        Catálogo de produtos.

        O cliente lê os produtos ativos com os campos públicos; a equipe lê o
        catálogo inteiro e cadastra. O estoque tem endpoint próprio.
      parameters:
      - in: query
        name: categoria
        schema:
          type: string
          enum:
          - essencia
          - pod_descartavel
          - pod_recarregavel
          - vape
          - vaporizador_ervas
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -criado_em
          - -nome
          - -preco
          - criado_em
          - nome
          - preco
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: subtipo
        schema:
          type: string
        description: Slug do subtipo.
      tags:
      - produtos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProdutoConformeQuemPerguntaList'
          description: ''
    post:
      operationId: produtos_create
      description: |-
        Catálogo de produtos.

        O cliente lê os produtos ativos com os campos públicos; a equipe lê o
        catálogo inteiro e cadastra. O estoque tem endpoint próprio.
      tags:
      - produtos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProdutoGestaoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProdutoGestaoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProdutoGestaoRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProdutoGestao'
          description: ''
  /api/produtos/{id}/:
    get:
      operationId: produtos_retrieve
      description: |-
        Catálogo de produtos.

        O cliente lê os produtos ativos com os campos públicos; a equipe lê o
        catálogo inteiro e cadastra. O estoque tem endpoint próprio.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this produto.
        required: true
      tags:
      - produtos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
